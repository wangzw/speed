# A configuration this host serves on by hand, kept small on purpose: the cases
# in e2e_test.go write their own, with their own ports and their own database
# file, so nothing here is load-bearing for `make check`.
#
# The one account is alice with the password "s3cret", which the gateway knows
# as static.alice. The entry below is what the `hash` command produces for it, an
# Argon2id string in the PHC form, which is the only form a password is ever
# written in: this file is the one an operator checks in or mounts as a secret.
http:
  endpoints:
    public:
      address: "127.0.0.1:8080"
    ops:
      address: "127.0.0.1:8081"
db:
  sqlite:
    dsn: "orders-host.db"
authn:
  gate:
    # Left out, the key guards every endpoint. Naming the public one narrows
    # that, so the ops endpoint, which serves the health check and carries no
    # credential, is not guarded.
    endpoints:
      - public
  static:
    subjects:
      alice: "$argon2id$v=19$m=19456,t=2,p=1$PdXT9r3cnPwrIV3GuEnpkQ$HQpohtsI56f/s9qfHKmVnLKmjVJwXZdCnq3WWBHHp9s"
tenant:
  resolve:
    endpoints:
      - public
    extractor: header
    header-name: X-Tenant
  catalog:
    refresh-period: 30s
audit:
  journal:
    endpoints:
      - public
    requests:
      - "GET /orders"
    events:
      - order.placed
settings:
  refresh-interval: 30s
ratelimit:
  endpoints:
    - public
observability:
  otel:
    service-name: orders-host
    endpoints:
      - public
