
name: setup
description: Install the .mise.toml toolchain, or a named subset of it, and optionally the frontend dependencies and Playwright's Chromium and WebKit

inputs:
  tools:
    description: >-
      The tools to install, as a space-separated list of names from .mise.toml
      (for example `go`). Empty installs every tool .mise.toml lists. A tool
      not named is neither installed nor put on PATH, and mise does not warn
      about it as missing.
    required: false
    default: ""
  playwright:
    description: >-
      Install Playwright's Chromium and WebKit with the system libraries they
      need, after installing the frontend workspace's dependencies from its
      shared lockfile (`pnpm -C web install --frozen-lockfile
      --workspace-concurrency=1 --child-concurrency="${GATE_JOBS}"`): the
      browsers are installed through the workspace's own Playwright package,
      and the browser and end-to-end targets run from the same install. The
      calling workflow must set GATE_JOBS, which caps the install's child
      processes; a caller that omits it fails here rather than letting pnpm
      fall back to its defaults. The demo host under starters/demo/web is a
      member of that workspace, so one install covers both. A job that runs
      the gate's frontend legs leaves this off: `web-check-static` installs
      the dependencies for itself.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Limit mise to the named tools
      if: inputs.tools != ''
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: echo "MISE_ENABLE_TOOLS=${TOOLS// /,}" >> "${GITHUB_ENV}"

    - name: Install the toolchain from .mise.toml
      uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        install_args: ${{ inputs.tools }}

    - name: Install the frontend dependencies Playwright runs from
      if: inputs.playwright == 'true'
      shell: bash
      run: pnpm -C web install --frozen-lockfile --workspace-concurrency=1 --child-concurrency="${GATE_JOBS:?the calling workflow must set GATE_JOBS}"

    - name: Install the system libraries Chromium and WebKit need
      if: inputs.playwright == 'true'
      shell: bash
      run: pnpm -C web exec playwright install-deps chromium webkit

    - name: Install Chromium and WebKit
      if: inputs.playwright == 'true'
      shell: bash
      run: make e2e-install
