# The toolchain every workflow job starts from.
#
# The tools come from .mise.toml, so a pin bumped there is the pin CI runs, and
# no workflow carries a tool version of its own. The whole set is installed
# rather than the subset a job uses: the Makefile runs `go work edit` while it
# is parsed, so any job that calls make needs go on PATH, and mise-action caches
# the installed set between runs.
#
# The one input adds what a job needs on top of the toolchain, and is off by
# default: a job that runs only Go and repository checks installs none of it.

name: setup
description: Install the .mise.toml toolchain, and optionally the frontend dependencies and Playwright Chromium

inputs:
  playwright:
    description: >-
      Install Playwright's Chromium with the system libraries it needs, after
      installing the frontend workspace's dependencies from its lockfile
      (`pnpm -C web install --frozen-lockfile`): the browser is installed
      through the workspace's own Playwright package, and the browser and
      end-to-end targets run from the same install. The demo host under
      starters/demo/web is a member of that workspace, so one install covers
      both. A job that runs `make check` leaves this off: its web-check leg
      installs for itself.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install the toolchain from .mise.toml
      uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

    - name: Install the frontend dependencies Playwright runs from
      if: inputs.playwright == 'true'
      shell: bash
      run: pnpm -C web install --frozen-lockfile

    # The libraries come from apt and need root, which a hosted runner's
    # passwordless sudo provides; Playwright invokes sudo itself.
    - name: Install the system libraries Chromium needs
      if: inputs.playwright == 'true'
      shell: bash
      run: pnpm -C web exec playwright install-deps chromium

    - name: Install Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: make e2e-install
