
version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /pkg
      - /starters/demo/server
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      gomod-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
        exclude-patterns:
          - "github.com/alibabacloud-go/dysmsapi-20170525/*"
          - "github.com/tencentcloud/tencentcloud-sdk-go/tencentcloud/sms"
          - "github.com/aws/aws-sdk-go-v2/service/pinpointsmsvoicev2"
          - "github.com/twilio/twilio-go"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /starters/demo
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "node"
      - dependency-name: "golang"
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
