# Dependency updates, weekly.
#
# Minor and patch bumps of one ecosystem arrive as one pull request; a major
# bump arrives alone, because it is the one that can break a build. Every
# directory of an ecosystem is listed here, so a module or lockfile added later
# needs a line added with it:
#
#   gomod            the Go modules go.work lists
#   npm              the pnpm lockfile of the frontend workspace (web/), which
#                    also resolves the demo host under starters/demo/web
#   github-actions   the workflows, and the local setup action's own uses: lines
#   docker           the demo program's Dockerfile
#
# The commit-message prefixes are Conventional Commits headers the repository's
# commit convention allows: `deps` for dependency bumps and `ci` for workflow
# actions.

version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /pkg
      - /starters/demo/server
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      gomod-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /starters/demo
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
