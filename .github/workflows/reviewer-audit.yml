# 用途：Scheduler 派发（合并触发或人类指定范围触发），运行 Reviewer 的独立事后审计。
#
# 引用 coding-flow 自己发布的 composite action（见 https://github.com/vislake/coding-flows/blob/main/.claude/skills/coding-flow/SKILL.md「Skill 封装与复用」），
# 不 vendor skill 内容，action 引用固定写死指向本项目发布地址。
#
# 参考规范：https://github.com/vislake/coding-flows/blob/main/.claude/skills/coding-flow/SKILL.md「角色分发」、https://github.com/vislake/coding-flows/blob/main/.claude/skills/coding-flow/references/reviewer.md
#   - 权限：contents: read + issues: write + pull-requests: write + id-token: write
#     （不需要代码写权限——Reviewer 不 push 代码）
#   - 无条件新开审计结果 Issue（phase:audit）；发现本主体问题则该 Issue 转 phase:planning 继续存活；
#     发现跨主体问题则另开 Issue 并建 blocked_by；仅有跨主体问题时审计结果 Issue 关联后即关闭；
#     已关闭 Issue 一律不重新打开——以上全部逻辑由 Reviewer 角色自己的 Workflow 脚本处理，
#     本 job 只负责把它启动起来

name: coding-flow reviewer-audit
run-name: "coding-flow reviewer ${{ inputs.scope }}"
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "审计范围：合并触发时是刚合并的主题 Issue 编号；人类主动触发时是人类描述的范围"
        required: true
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # 见 https://github.com/vislake/coding-flows/blob/main/.claude/skills/coding-flow/references/scheduler.md「轮询节奏」的超时阈值表
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Reviewer (audit mode)
        uses: vislake/coding-flows@main
        with:
          mode: role
          role: reviewer
          scope: ${{ inputs.scope }}
          github_token: ${{ github.token }} # Reviewer 不 push 代码，默认 token 够用，
            # 显式传入是为了绕开 action 默认走 Claude GitHub App OIDC 的路径
          anthropic_auth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic_base_url: ${{ vars.ANTHROPIC_BASE_URL }}
          anthropic_model: ${{ vars.ANTHROPIC_MODEL }}
          claude_code_effort_level: ${{ vars.CLAUDE_CODE_EFFORT_LEVEL }}
