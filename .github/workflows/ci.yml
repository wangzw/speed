
name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a run on main: a cancelled push run leaves its commit without a
# verdict. The group also keys on the event and the PR number or ref, so a run
# dispatched by hand does not replace a push run.
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  GATE_JOBS: "4"
  GOFLAGS: -count=1

jobs:
  static:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Resolve the Go cache directories
        id: go-cache
        run: |
          echo "modcache=$(go env GOMODCACHE)" >> "${GITHUB_OUTPUT}"
          echo "buildcache=$(go env GOCACHE)" >> "${GITHUB_OUTPUT}"

      - name: Restore the Go caches
        id: go-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modcache }}
            ${{ steps.go-cache.outputs.buildcache }}
          key: go-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-
            go-${{ runner.os }}-

      - name: Restore the golangci-lint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('.golangci.yml', 'go.work', '**/go.sum', '.mise.toml') }}
          restore-keys: |
            golangci-${{ runner.os }}-

      - name: Run the static checks
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        run: make lint tidy-check repo-check tools-test vet-web-bundle vet-integration

  go-test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Resolve the Go cache directories
        id: go-cache
        run: |
          {
            echo "modcache=$(go env GOMODCACHE)"
            echo "buildcache=$(go env GOCACHE)"
            echo "started=$(date +%s)"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore the Go caches
        id: go-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modcache }}
            ${{ steps.go-cache.outputs.buildcache }}
          key: go-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-
            go-${{ runner.os }}-

      - name: Run the Go build and unit tests
        run: make build test

      - name: Trim the Go build cache to this run's entries
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache-restore.outcome == 'success' && steps.go-cache-restore.outputs.cache-hit != 'true'
        env:
          STARTED: ${{ steps.go-cache.outputs.started }}
          GOCACHE_DIR: ${{ steps.go-cache.outputs.buildcache }}
          GOMODCACHE_DIR: ${{ steps.go-cache.outputs.modcache }}
        run: |
          du -sh "${GOCACHE_DIR}" "${GOMODCACHE_DIR}"
          python tools/trim_go_cache.py --cache-dir "${GOCACHE_DIR}" --started "${STARTED}"
          du -sh "${GOCACHE_DIR}" "${GOMODCACHE_DIR}"

      - name: Save the Go caches
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache-restore.outcome == 'success' && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modcache }}
            ${{ steps.go-cache.outputs.buildcache }}
          key: go-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-${{ github.sha }}

  go-race-pkg:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Resolve the Go cache directories
        id: go-cache
        run: |
          {
            echo "modcache=$(go env GOMODCACHE)"
            echo "buildcache=$(go env GOCACHE)"
            echo "started=$(date +%s)"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore the Go caches
        id: go-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modcache }}
            ${{ steps.go-cache.outputs.buildcache }}
          # -race builds different object IDs, so each race job keeps its own
          # go-race-<job>-... key; the plain go-... key is a last-resort restore
          # only, since reusing it re-instruments the standard library each run.
          key: go-race-pkg-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-${{ github.sha }}
          restore-keys: |
            go-race-pkg-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-
            go-race-pkg-${{ runner.os }}-
            go-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-

      - name: Run the pkg race detector
        run: make test-race MODULES=./pkg

      - name: Trim the Go build cache to this run's entries
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache-restore.outcome == 'success' && steps.go-cache-restore.outputs.cache-hit != 'true'
        env:
          STARTED: ${{ steps.go-cache.outputs.started }}
          GOCACHE_DIR: ${{ steps.go-cache.outputs.buildcache }}
          GOMODCACHE_DIR: ${{ steps.go-cache.outputs.modcache }}
        run: |
          du -sh "${GOCACHE_DIR}" "${GOMODCACHE_DIR}"
          python tools/trim_go_cache.py --cache-dir "${GOCACHE_DIR}" --started "${STARTED}"
          du -sh "${GOCACHE_DIR}" "${GOMODCACHE_DIR}"

      - name: Save the pkg race build outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache-restore.outcome == 'success' && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modcache }}
            ${{ steps.go-cache.outputs.buildcache }}
          key: go-race-pkg-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-${{ github.sha }}

  go-race-demo:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Resolve the Go cache directories
        id: go-cache
        run: |
          {
            echo "modcache=$(go env GOMODCACHE)"
            echo "buildcache=$(go env GOCACHE)"
            echo "started=$(date +%s)"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore the Go caches
        id: go-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modcache }}
            ${{ steps.go-cache.outputs.buildcache }}
          key: go-race-demo-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-${{ github.sha }}
          restore-keys: |
            go-race-demo-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-
            go-race-demo-${{ runner.os }}-
            go-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-

      - name: Run the demo server race detector
        run: make test-race MODULES=./starters/demo/server

      - name: Trim the Go build cache to this run's entries
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache-restore.outcome == 'success' && steps.go-cache-restore.outputs.cache-hit != 'true'
        env:
          STARTED: ${{ steps.go-cache.outputs.started }}
          GOCACHE_DIR: ${{ steps.go-cache.outputs.buildcache }}
          GOMODCACHE_DIR: ${{ steps.go-cache.outputs.modcache }}
        run: |
          du -sh "${GOCACHE_DIR}" "${GOMODCACHE_DIR}"
          python tools/trim_go_cache.py --cache-dir "${GOCACHE_DIR}" --started "${STARTED}"
          du -sh "${GOCACHE_DIR}" "${GOMODCACHE_DIR}"

      - name: Save the demo server race build outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache-restore.outcome == 'success' && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modcache }}
            ${{ steps.go-cache.outputs.buildcache }}
          key: go-race-demo-${{ runner.os }}-${{ hashFiles('go.work', '**/go.sum', '.mise.toml') }}-${{ github.sha }}

  web-static-build:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Resolve the pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "${GITHUB_OUTPUT}"

      - name: Restore and save the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Run the frontend static checks and build
        run: make web-check-static web-check-build

  web-test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Resolve the pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "${GITHUB_OUTPUT}"

      - name: Restore the pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install the frontend dependencies
        run: pnpm -C web install --frozen-lockfile --workspace-concurrency=1 --child-concurrency="${GATE_JOBS}"

      - name: Run the frontend tests
        run: make web-check-test
