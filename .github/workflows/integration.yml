
name: integration

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Run the integration cases
        run: make test-integration

      - name: Run the integration cases under the race detector
        if: ${{ !cancelled() }}
        run: make test-integration-race

      - name: Dump the backends' logs
        if: failure()
        run: |
          state=.cache/test-backends.env
          if [ ! -f "${state}" ]; then
            echo "::notice::no backend state file at ${state}: the stack never came up, so there are no logs to dump"
            exit 0
          fi
          project="$(sed -n 's/^SPEED_TEST_PROJECT=//p' "${state}")"
          if [ -z "${project}" ]; then
            echo "::error::${state} names no SPEED_TEST_PROJECT"
            exit 1
          fi
          docker compose -f compose.yaml -p "${project}" ps --all
          docker compose -f compose.yaml -p "${project}" logs --no-color --timestamps

      - name: Take the backends down
        if: always()
        run: make deps-down
