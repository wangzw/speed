
name: e2e

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GATE_JOBS: "4"

jobs:
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      SPEED_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-e2e00000
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain, the frontend dependencies, Chromium and WebKit
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Run the end-to-end journeys
        run: make e2e

      - name: Upload the run's report and per-test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-run-directory-${{ github.run_attempt }}
          path: |
            /tmp/speed-e2e-${{ env.SPEED_E2E_RUN_ID }}/report
            /tmp/speed-e2e-${{ env.SPEED_E2E_RUN_ID }}/artifacts
          retention-days: 14
          if-no-files-found: ignore
