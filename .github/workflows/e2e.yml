# The end-to-end journey tier, on a schedule.
#
# The specs drive the built demo binary through Chromium, and one journey also
# through WebKit, against a real sqlite file and real HTTP (see
# starters/demo/web/e2e/README.md). The tier is not part of `make check`: it
# needs Chromium, WebKit and a built backend, and it is slower than the commit
# gate, so this is the periodic leg that runs it. Without it a committed journey
# would only run when a person remembered `make e2e`.
#
# Chromium and WebKit are not part of the .mise.toml toolchain, so the setup
# action installs them with their system libraries. The command list stays in
# the Makefile (`make e2e`), exactly as ci.yml's does. The global setup builds
# the front end into the git-ignored starters/demo/server/dist-e2e in the
# checkout, because the e2e-tagged binaries embed it, and builds the binaries
# into the run's own /tmp directory.
#
# The run's directory is /tmp/speed-e2e-<SPEED_E2E_RUN_ID>. The id has to match
# the shape starters/demo/web/e2e/fixtures/retention.ts sweeps and removes,
# which is <digits>-<base36>-<eight hex digits>: the run id and the attempt
# make it unique, and the last part exists only to complete the shape. A
# passing run removes its directory; a failing one keeps it, and this workflow
# uploads what is worth reading from it: the HTML report and Playwright's
# per-test output (traces, screenshots, the attached process log). The
# harness directory beside them holds the built binaries and is left out. A run
# that fails before any test starts has neither directory, so the upload
# tolerates finding nothing.
#
# The cron is off the hour on purpose, like integration.yml's and browser.yml's.

name: e2e

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The hosted runner's four cores, as ci.yml sets it; the setup action's
  # frontend install takes its width from here.
  GATE_JOBS: "4"

jobs:
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      SPEED_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-e2e00000
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain, the frontend dependencies, Chromium and WebKit
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Run the end-to-end journeys
        run: make e2e

      - name: Upload the run's report and per-test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-run-directory-${{ github.run_attempt }}
          path: |
            /tmp/speed-e2e-${{ env.SPEED_E2E_RUN_ID }}/report
            /tmp/speed-e2e-${{ env.SPEED_E2E_RUN_ID }}/artifacts
          retention-days: 14
          if-no-files-found: ignore
