# The end-to-end journey tier, on a schedule.
#
# The specs drive the built demo binary through Chromium against a real sqlite
# file and real HTTP (see starters/demo/web/e2e/README.md). The tier is not
# part of `make check` -- it needs Chromium and a built backend, and it is
# slower than the commit gate -- so this is the periodic leg that runs it.
# Without this file a committed journey would only run when a person
# remembered `make e2e`, while the journey registry kept saying covered.
#
# Chromium is not part of the .mise.toml toolchain, so this job installs it and
# then calls the repository's own entry point; the command list stays in the
# Makefile (`make e2e`), exactly as ci.yml, browser.yml and integration.yml
# keep theirs. The global setup builds the front end and the review binary
# itself, into the run's own /tmp root.
#
# The cron is off the hour on purpose, like integration.yml's and
# browser.yml's.
#
# This job runs on the organization's self-hosted runner group, labelled
# `self-hosted-runners`, because hosted GitHub Actions runners are not
# available to this account. The group is maintained outside this repository.
# Besides what .mise.toml pins (go, node, pnpm, python), a runner has to be
# able to run Chromium: this file installs it, and the browser needs the
# usual shared libraries, which a Linux runner without root may not have --
# so the install asks for them only when it can. A job that stays queued
# rather than failing means no runner of that label is online, or the runner
# group does not grant this repository.

name: e2e

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: self-hosted-runners
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
      - name: Report the runner and the toolchain it provides
        run: |
          echo "runner.os=${{ runner.os }} runner.arch=${{ runner.arch }}"
          echo "uname=$(uname -srm)"
          go version
          node --version
          pnpm --version
          python3 --version
      - run: pnpm -C web install --frozen-lockfile
      # The runner's OS is whoever set it up. On Linux the browser needs
      # system libraries; installing them needs root, so the job asks for
      # them only when it can and otherwise installs the browser alone and
      # says so, rather than failing the tier on a permission it does not
      # have.
      - name: Install Chromium
        run: |
          if [ "${{ runner.os }}" = "Linux" ] && command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            pnpm -C web exec playwright install --with-deps chromium
          else
            echo "installing the browser without system dependencies:" \
              "runner.os=${{ runner.os }} and no passwordless sudo"
            pnpm -C web exec playwright install chromium
          fi
      - run: make e2e
