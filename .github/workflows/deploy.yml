# The demo program's deployment to Fly.io.
#
# It runs only when dispatched by hand on main. A dispatch ships the commit it
# was dispatched on (github.sha), and only after that commit's `check` workflow
# has concluded successfully: `decide` reads that commit's runs through the
# Actions API and accepts a successful run made by a push to main or by a
# dispatch of the check workflow on main, since both test the commit itself. A
# pull-request run tests the merge commit, not this one, and never counts. A
# request made on any other ref fails in the `refuse` job with an error naming
# the ref: a dispatch that would deploy nothing is a failed run, not a skipped
# one.
#
# Nothing deploys on a push. A tip whose check failed, was cancelled or was
# replaced stays undeployed until a check run of it succeeds, whether by
# re-running the push run or by dispatching the check workflow on main. A
# commit pushed with [skip ci] gets no push run at all; dispatching the check
# workflow on main for it supplies the verdict, and the deploy is dispatched
# afterwards.
#
# Three jobs. `refuse` fails a dispatch outside main and has no other effect.
# `decide` resolves the commit, requires a successful check run for it, and
# compares it with the tip of main, which it reads from the public origin with
# git ls-remote, so that comparison needs no credential of its own. The Actions
# API read uses the workflow's automatic token, which is why the `decide` job
# alone asks for `actions: read`. `decide` declares no concurrency group, no
# environment and no deploy secret, so its runs do not queue behind one
# another and none of them can touch the deployment. `deploy` needs it and runs
# only when the commit is the tip; a commit that main has moved past is skipped
# with a notice. An older tree must not replace a newer one when runs queue up.
#
# The deploy job runs in the `production` environment, and FLY_API_TOKEN is a
# secret of that environment. GitHub creates the environment the first time the
# deploy job starts; the secret is added to it by hand. A deploy job that
# reaches the token check while FLY_API_TOKEN is not set fails there, with an
# error that says where to add the secret, instead of letting flyctl fail on a
# missing credential. The token is in the environment of the one step that
# deploys.
#
# The work is one Makefile target (`make fly`); this file installs the one tool
# that target calls. flyctl is deployment machinery rather than a build input, so
# .mise.toml does not pin it and this file does. The image is built by Fly's
# remote builder, so the runner needs no Docker daemon. The setup action installs
# go alone: the Makefile runs `go work edit` while it is parsed, and nothing else
# the Makefile pins is used by `make fly`. The app, its volume and the three secrets the entrypoint reads are
# created once, by hand (starters/demo/AGENTS.md, "Deploying to Fly.io").

name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  refuse:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Refuse a dispatch outside main
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::deploy ships the tip of main only: dispatched on ${REF}; dispatch it on main"
          exit 1

  decide:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # The Actions API read is the only thing in this workflow that needs more
    # than the contents of the repository.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.tip.outputs.commit }}
      is_tip: ${{ steps.tip.outputs.is_tip }}
    steps:
      - name: Resolve the commit and compare it with the tip of main
        id: tip
        env:
          COMMIT: ${{ github.sha }}
        run: |
          tip="$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ]; then
            echo "::error::git ls-remote found no refs/heads/main in ${GITHUB_REPOSITORY}"
            exit 1
          fi
          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"
          if [ "${tip}" = "${COMMIT}" ]; then
            echo "is_tip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::not deploying ${COMMIT}: main is now at ${tip}; dispatch this workflow on main after that commit's check passes to deploy it"
            echo "is_tip=false" >> "${GITHUB_OUTPUT}"
          fi

      # The commit is immutable, but its verdict is not: the commit may have no
      # check run at all, that run may still be running, or it may have
      # concluded anything but success. Only a successful run made by a push to
      # main or by a dispatch of the check workflow on main deploys the tree;
      # a pull-request run tests the merge commit and is not a verdict on this
      # one.
      - name: Refuse a commit whose check did not succeed
        if: steps.tip.outputs.is_tip == 'true'
        env:
          COMMIT: ${{ steps.tip.outputs.commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! response="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&per_page=100")"; then
            echo "::error::could not list the check workflow runs for ${COMMIT} through the Actions API"
            exit 1
          fi
          succeeded="$(printf '%s' "${response}" | jq '[.workflow_runs[] | select(.head_branch == "main" and (.event == "push" or .event == "workflow_dispatch") and .conclusion == "success")] | length')"
          if [ "${succeeded}" -gt 0 ]; then
            exit 0
          fi
          runs="$(printf '%s' "${response}" | jq -r '.workflow_runs | if length == 0 then "none" else map(.conclusion // .status) | join(", ") end')"
          echo "::error::deploy requires a successful check run for ${COMMIT} from a push or a dispatch on main: its check workflow runs are ${runs}; dispatch the check workflow on main for that commit (or re-run its push run), and deploy again after it passes"
          exit 1

  deploy:
    needs: decide
    if: needs.decide.outputs.is_tip == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: production
    # Deploys replace one Machine at a time; two overlapping runs would race for
    # the same volume, and the group does not cancel a running deploy. The group
    # is on this job rather than on the workflow or on `decide` because a run
    # that enters the group replaces the run waiting there even with
    # cancel-in-progress false. Only a run whose commit `decide` found at main's
    # tip may enter: a run that `decide` skipped, or that found main past its
    # commit, does not start this job and so does not evict a waiting deploy.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # This job may have waited in the group behind a deploy that was running,
      # and main may point at another commit by then, so the tip is read again
      # before anything is set up or deployed. The check verdict is not read
      # again: `decide` read the runs as they stood when it ran, and a re-run of
      # a check run keeps its run id, so its conclusion changes with the latest
      # attempt. A verdict that changes after `decide` is therefore not seen
      # here; that trade-off keeps the deploy from re-querying the API and from
      # stopping once it has started.
      - name: Check that the commit is still the tip of main
        id: tip
        env:
          COMMIT: ${{ needs.decide.outputs.commit }}
        run: |
          tip="$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -z "${tip}" ]; then
            echo "::error::git ls-remote found no refs/heads/main in ${GITHUB_REPOSITORY}"
            exit 1
          fi
          if [ "${tip}" = "${COMMIT}" ]; then
            echo "is_tip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::skipping the deploy of ${COMMIT}: main is now at ${tip}; dispatch this workflow on main after that commit's check passes to deploy it"
            echo "is_tip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Require the Fly API token
        if: steps.tip.outputs.is_tip == 'true'
        env:
          TOKEN_PRESENT: ${{ secrets.FLY_API_TOKEN != '' }}
        run: |
          if [ "${TOKEN_PRESENT}" != "true" ]; then
            echo "::error::the secret FLY_API_TOKEN is empty: add it as a secret of the production environment (Settings > Environments > production > Environment secrets)"
            exit 1
          fi

      - name: Check out the commit
        if: steps.tip.outputs.is_tip == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.commit }}
          persist-credentials: false

      - name: Set up go
        if: steps.tip.outputs.is_tip == 'true'
        uses: ./.github/actions/setup
        with:
          tools: go

      # Tag 1.6 has no GitHub Release: the latest release, 1.5, declares the
      # node20 runtime and 1.6 declares node24. The major tag v1 points at the
      # same commit as 1.6.
      - name: Set up flyctl
        if: steps.tip.outputs.is_tip == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: "0.4.99"

      - name: Deploy to Fly.io
        if: steps.tip.outputs.is_tip == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: make fly
