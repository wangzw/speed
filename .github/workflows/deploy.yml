# The demo program's deployment to Fly.io.
#
# It runs when the `check` workflow has completed successfully on main, and on
# request. The trigger is that completion rather than the push itself: a deploy
# starts only for a commit that has passed the gate, and it ships that commit's
# own tree (workflow_run.head_sha), not whatever main holds when the runner
# picks the job up.
#
# The work is one Makefile target (`make fly`); this file installs the one
# tool that target calls. flyctl is deployment machinery rather than a build
# input, so .mise.toml does not pin it and this file does. The image is built by
# Fly's remote builder, so the runner needs no Docker daemon and no Go or Node
# toolchain.
#
# A deploy needs FLY_API_TOKEN among the repository's secrets; the app, its
# volume and the three secrets the entrypoint reads are created once, by hand
# (starters/demo/AGENTS.md, "Deploying to Fly.io").

name: deploy

on:
  workflow_run:
    workflows: ["check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys replace one Machine at a time; two overlapping runs would race for
# the same volume. A queued run is allowed to finish rather than be cancelled:
# the later commit is the one that should end up live.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        with:
          version: "0.4.99"
      - run: make fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
