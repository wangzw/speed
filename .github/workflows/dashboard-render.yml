# 用途：Scheduler 通过 `gh workflow run` 派发，渲染看板并发布到 gh-pages 分支。
#
# 这是确定性脚本任务，不涉及 agent 推理，不需要 anthropics/claude-code-action。
# 引用 coding-flow 自己发布的 composite action（仓库根目录的 action.yml，`mode: dashboard`），
# render.py/publish.sh 在每次运行时直接从那个 action 的 checkout 里跑，不 vendor 进本仓库，
# action 引用固定写死指向本项目发布地址。
#
# 参考规范：../../SKILL.md「看板：调度状态可视化」、../../references/scheduler.md「看板发布」

name: coding-flow dashboard-render
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 见 ../../references/scheduler.md「轮询节奏」的超时阈值表
    permissions:
      contents: write
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render and publish dashboard
        uses: vislake/coding-flows@main
        with:
          mode: dashboard
