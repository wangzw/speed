# 用途：Scheduler 通过 `gh workflow run` 派发，运行 Coder 的实施流程
#（依据 plan 实施，内置对代码的对抗性审查，收敛后合并进 main）。
#
# 用官方 anthropics/claude-code-action 运行 Claude Code，不自己装 CLI/维护认证逻辑。
# `.claude/skills/coding-flow/` 由 `init` 时一次性拷贝进本仓库、提交入库（见 ../../SKILL.md
# 「Skill 封装与复用」），所以这里 checkout 一下就自然带有 skill 内容。
#
# 参考规范：../../SKILL.md「凭证与权限」、../../references/coder.md、../../references/scheduler.md
#   - contents: write，但只操作专属分支（分支名由 Scheduler 决定并通过 branch input 传入，
#     格式 <prefix>/issue-<N>-<slug>，prefix 不固定为 feat，Coder 不自己发明分支名），
#     按自身流程走 PR 合并、不直接 push main；main 是否用分支保护规则强制挡住直接 push
#     由目标项目自行决定，本 skill 不要求、不假设
#   - Git/GitHub 操作凭证必须用独立 PAT，不能用默认 GITHUB_TOKEN，
#     否则 Coder 开的 PR 不会级联触发目标项目原有的 CI
#
# 认证/模型配置走环境变量（ANTHROPIC_AUTH_TOKEN 等），不用 claude-code-action 的
# anthropic_api_key input——这样同一套配置也能兼容自建的 Anthropic 兼容网关
# （ANTHROPIC_BASE_URL 指向自建网关时）。ANTHROPIC_BASE_URL/ANTHROPIC_MODEL/
# CLAUDE_CODE_EFFORT_LEVEL 用 repo/org variables（vars），不是 secret；只有
# ANTHROPIC_AUTH_TOKEN 是 secret。anthropics/claude-code-action 的具体 inputs（包括它自己
# 接收 github token 的参数名）以其当前版本文档为准
# （https://github.com/anthropics/claude-code-action），接入真实环境时请核对。

name: coding-flow coder-implementation
run-name: "coding-flow coder issue-${{ inputs.issue_number }} ${{ inputs.phase }}"
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "主题 Issue 编号"
        required: true
        type: string
      phase:
        description: "当前 phase（应为 phase:implementation）"
        required: true
        type: string
      branch:
        description: "由 Scheduler 决定的分支名，格式 <prefix>/issue-<N>-<slug>"
        required: true
        type: string

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # 5 小时，见 ../../references/coder.md「收敛判定」：运行超过 280 分钟即主动收尾，留 20 分钟余量；
    # GitHub 托管 runner 硬上限 360 分钟，此值已接近该上限，任务经常需要更长时间应改用自托管 runner
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # anthropics/claude-code-action 用 OIDC 换取短期 token，缺这个权限会在启动阶段就失败
    env:
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      CLAUDE_CODE_EFFORT_LEVEL: ${{ vars.CLAUDE_CODE_EFFORT_LEVEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CODING_FLOW_PAT }} # 独立 PAT，非默认 GITHUB_TOKEN，见 SKILL.md「凭证与权限」
          fetch-depth: 0 # 需要完整历史才能做 rebase（见「收敛判定」的合并失败处理）

      - name: Prepare branch
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Run Coder (implementation mode)
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.CODING_FLOW_PAT }} # 保证 Coder 的 git/gh 操作走独立 PAT，不用默认 GITHUB_TOKEN
          prompt: |
            /coding-flow coder issue_number=${{ inputs.issue_number }} phase=${{ inputs.phase }} branch=${{ inputs.branch }}
        # 具体执行流程（拉取上下文 → 实施 → Workflow 工具做对抗性审查 → 收敛判定 →
        # 合并 → 结构化评论）见 ../../references/coder.md「执行流程」，
        # 包括 push、开/合并 PR 在内的所有 git/gh 操作都由 Coder 角色在这次调用内部完成，
        # 本 job 不额外拆步骤——这样合并失败时的重试/收尾逻辑也统一由角色自身的 Workflow 脚本处理。
