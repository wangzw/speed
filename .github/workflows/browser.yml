
name: browser

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GATE_JOBS: "4"

jobs:
  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain, Chromium and WebKit
        uses: ./.github/actions/setup
        with:
          playwright: "true"

      - name: Run the browser tier
        run: make web-browser

      - name: Upload the failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-screenshots-${{ github.run_attempt }}
          path: |
            web/.vitest/**
            starters/demo/web/.vitest/**
            web/packages/*/src/**/__screenshots__/**
            starters/demo/web/src/**/__screenshots__/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
