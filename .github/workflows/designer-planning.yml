# 用途：Scheduler 通过 `gh workflow run` 派发，运行 Designer 的规划模式
#（从设计文档生成/迭代 plan，内置对抗性审查；也承担 phase:design 中途状态的自主处理/
#  等人类恢复后继续，见 ../../references/scheduler.md「Phase → Workflow 映射」）。
#
# 引用 coding-flow 自己发布的 composite action（仓库根目录的 action.yml，`mode: role`），
# 不 vendor skill 内容——`init` 只落地这个薄包装 workflow，skill 内容在每次运行时由
# 那个 action 自己从它的 checkout 里取（见 ../../SKILL.md「Skill 封装与复用」）。
#
# 参考规范：../../SKILL.md「凭证与权限」、../../references/designer.md
#   - 统一用 workflow_dispatch，由 Scheduler 显式派发
#   - 权限：contents: read + issues: write + pull-requests: write + id-token: write
#     （不需要代码写权限——Designer 不 push 代码，不受「必须用独立 PAT」那条约束；
#     id-token: write 是 anthropics/claude-code-action 的 OIDC 换取短期 token 用的，
#     缺这个权限会在启动阶段就失败）
#
# action 引用固定写死指向本项目发布地址，不做占位符替换（见 ../../SKILL.md「Skill 封装与复用」）。

name: coding-flow designer-planning
run-name: "coding-flow designer issue-${{ inputs.issue_number }} ${{ inputs.phase }}"
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "主题 Issue 编号"
        required: true
        type: string
      phase:
        description: "当前 phase（phase:planning 或 phase:design 中途状态）"
        required: true
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 见 ../../references/scheduler.md「轮询节奏」的超时阈值表
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Designer (planning mode)
        uses: vislake/coding-flows@main
        with:
          mode: role
          role: designer
          issue_number: ${{ inputs.issue_number }}
          phase: ${{ inputs.phase }}
          github_token: ${{ github.token }} # Designer 不 push 代码，默认 token 够用，
            # 显式传入是为了绕开 action 默认走 Claude GitHub App OIDC 的路径（见 action 自身注释）
          anthropic_auth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic_base_url: ${{ vars.ANTHROPIC_BASE_URL }}
          anthropic_model: ${{ vars.ANTHROPIC_MODEL }}
          claude_code_effort_level: ${{ vars.CLAUDE_CODE_EFFORT_LEVEL }}
        # 具体执行流程（拉取上下文 → 生成/迭代 plan → Workflow 工具做对抗性审查 →
        # 收敛判定 → 写回 plan + 结构化评论）见 ../../references/designer.md「执行流程：规划」，
        # 全部由 Designer 角色在这次调用内部完成，本 job 不额外拆步骤。
