# The postgres stack: PostgreSQL for the database, the key-value store and the
# event bus all at once. One server carries every backend, which is the
# smallest deployment that needs no in-process store. Bring it up with the
# compose file beside this one:
#
#   docker compose -f starters/demo/compose.yaml up -d postgres
#   go -C starters/demo run . --config file:testdata/postgres.yaml postgres migrate
#   go -C starters/demo run . --config file:testdata/postgres.yaml postgres serve
#
# The platform baseline above the backend section is the same as in
# sqlite-memory.yaml; only the backend section below differs between the five
# stack files. The values marked DEV are development defaults a copy must
# replace before serving real traffic (AGENTS.md lists them together).

http:
  endpoints:
    api:
      address: "127.0.0.1:8080"
    account:
      address: "127.0.0.1:8081"
    admin:
      address: "127.0.0.1:8082"
    ops:
      address: "127.0.0.1:8083"
    web:
      address: "127.0.0.1:8084"
  cors:
    endpoints:
      api:
        allow-origins:
          - "https://app.demo.test"

ops:
  endpoint: ops
  title: demo
  version: 0.1.0

webui:
  endpoint: web

log:
  level: info

observability:
  otel:
    service-name: demo

authn:
  gate:
    endpoints: [api, account, admin]
    mount:
      endpoint: account
      public-url: "https://demo.test"
  # DEV: the operators' password table; the entry is an Argon2id hash of
  # "operator-dev-secret" for the subject "operator".
  static:
    subjects:
      operator: "$argon2id$v=19$m=19456,t=2,p=1$xeAjr/xEt4mML0QaEhw8pw$Khjd7856RU6MatFxmOtE0YFZJLsC05yxX5HwJhpBXno"
  # DEV: the signing key is the dev-token-signing-key.pem shipped beside this file.
  token:
    algorithm: ES256
    signing-key-file: testdata/dev-token-signing-key.pem
  mfa:
    totp:
      issuer: demo

tenant:
  resolve:
    endpoints: [api]
    extractor: header
    header-name: X-Tenant
  admission:
    endpoints: [api]
  admin:
    endpoints: [admin]

authz:
  guard:
    endpoints: [api]
    undeclared: closed
  admin:
    endpoints: [admin]

audit:
  journal:
    endpoints: [api, account, admin]
    requests:
      - "GET /auth/me"
      - "POST /auth/admin/accounts"
  admin:
    endpoints: [admin]

ratelimit:
  endpoints: [api]

settings:
  admin:
    endpoints: [admin]

notification:
  inbox:
    endpoints: [api]
  stream:
    endpoints: [api]

objectstore:
  fs:
    root: "./var/objects"
  metadata:
    endpoints: [api]

# DEV: the database encryption key seals the columns a module encrypts at rest.
db:
  postgres:
    dsn: "postgres://speed:speed@127.0.0.1:5432/speed?sslmode=disable"
    encryption-key: "dev-only-change-me-0123456789abcdef"

kv:
  postgres:
    dsn: "postgres://speed:speed@127.0.0.1:5432/speed?sslmode=disable"

event:
  postgres:
    dsn: "postgres://speed:speed@127.0.0.1:5432/speed?sslmode=disable"
