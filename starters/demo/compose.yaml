services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: speed
      POSTGRES_PASSWORD: speed
      POSTGRES_DB: speed
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speed -d speed"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports:
      - "127.0.0.1:4222:4222"

  memcached:
    image: memcached:1.6-alpine
    ports:
      - "127.0.0.1:11211:11211"
