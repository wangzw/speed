
app = "vislake-speed-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[checks.ready]
  type = "http"
  port = 8083
  path = "/ready"
  method = "GET"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[[mounts]]
  source = "speed_demo_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
