<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>demo</title>
  </head>
  <body>
    <!--
      The committed stand-in for the frontend build. The Go program embeds
      web/dist with go:embed, and go:embed refuses to compile a directory with
      no files in it, so a checkout carries this one even though web/dist is a
      build output (starters/demo/.gitignore). It is tracked despite that rule,
      so a change to it is committed with `git add -f`.

      Building the frontend (pnpm build in this directory) replaces this file
      and its siblings in place with the real bundle; the Go side is unchanged
      either way, it serves whatever the directory holds.
    -->
    <main>
      <h1>demo</h1>
      <p>Build the frontend (pnpm build in web/) to replace this stand-in.</p>
    </main>
  </body>
</html>
