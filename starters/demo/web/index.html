<!doctype html>
<!-- The static defaults below describe the document before the app boots: a
     valid language tag, the brand as the title, the favicon and a
     description. The app-entry assembly (bootstrapSpeedApp, through
     SpeedAppDefinition.documentLanguage) sets <html lang> at startup and
     follows every switch; applyDocumentMetadata keeps the title in step with
     the language the instance negotiates, so the served defaults never
     contradict the rendered interface (WCAG 3.1.1). -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Speed 示范平台：B 端产品的可拷贝起点，装配租户门面与控制台。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Speed 示范</title>
  </head>
  <body>
    <!-- The one DOM root the app's bootstrap mounts into. main.tsx's
         bootstrapDemoApp takes a caller-supplied container and runs no
         module-scope side effects, so this page is the caller: it imports
         the bootstrap and mounts it exactly once. -->
    <div id="root"></div>
    <script type="module">
      import { bootstrapDemoApp } from '/src/main.tsx'
      const root = document.getElementById('root')
      if (root) void bootstrapDemoApp(root)
    </script>
  </body>
</html>
