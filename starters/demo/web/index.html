<!doctype html>
<!-- The static defaults below describe the document before the app boots: a
     valid language tag, the brand as the title, a favicon slot and a
     description. src/main.tsx's applyDocumentMetadata rewrites <html lang> and
     the title to the language the instance negotiates, so the served defaults
     never contradict the rendered interface (WCAG 3.1.1). -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Speed 示范平台：B 端产品的可拷贝起点，装配租户门面与控制台。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%231976d2'/%3E%3C/svg%3E"
    />
    <title>Speed 示范</title>
  </head>
  <body>
    <!-- The one DOM root the app's bootstrap mounts into. main.tsx's
         bootstrapDemoApp takes a caller-supplied container and runs no
         module-scope side effects, so this page is the caller: it imports
         the bootstrap and mounts it exactly once. -->
    <div id="root"></div>
    <script type="module">
      import { bootstrapDemoApp } from '/src/main.tsx'
      const root = document.getElementById('root')
      if (root) void bootstrapDemoApp(root)
    </script>
  </body>
</html>
