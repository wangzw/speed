# The postgres-redis-nats stack: PostgreSQL for the database, Redis for the
# key-value store and NATS for the event bus. It is the one stack that exports
# telemetry through OTLP rather than standard output:
#
#   docker compose -f starters/demo/compose.yaml up -d postgres redis nats
#   go -C starters/demo/server run . --config file:testdata/postgres-redis-nats.yaml postgres-redis-nats migrate
#   go -C starters/demo/server run . --config file:testdata/postgres-redis-nats.yaml postgres-redis-nats serve
#
# The OTLP export backend needs a collector at the endpoint below. It is not
# brought up by the compose file, and it is not a startup failure when nothing
# listens there: the exporters connect lazily, so the stack runs without one and
# simply exports nothing.
#
# The platform baseline above the backend section is the same as in
# sqlite-memory.yaml; only the backend section below differs between the six
# stack files. The values marked DEV are development defaults a copy must
# replace before serving real traffic (AGENTS.md lists them together).

http:
  listeners:
    backend:
      address: "127.0.0.1:8080"
    ops:
      address: "127.0.0.1:8083"
  # Each endpoint claims the path prefixes it answers on its listener. The
  # dispatch selects an endpoint by these claims alone, the longest claim
  # winning, and a path under no non-root claim goes to the endpoint that
  # claims "/". The table is the product's fixed namespace map: a capability
  # dropped from a run, or from the imports, keeps its namespace claimed. See
  # AGENTS.md.
  endpoints:
    api:
      listener: backend
      prefixes: ["/api"]
    account:
      listener: backend
      prefixes: ["/api/v1/auth", "/api/v1/features", "/api/v1/workspace", "/api/v1/tenants", "/api/v1/system/auth"]
    admin:
      listener: backend
      prefixes: ["/api/v1/system/audit", "/api/v1/system/permissions", "/api/v1/system/settings", "/api/v1/system/sms", "/api/v1/system/tenants"]
    ops:
      # Alone on its listener, so it claims "/" by default.
      listener: ops
    web:
      listener: backend
      prefixes: ["/"]
  # The CORS layer guards the api endpoint. This stack serves the frontend
  # bundle from the same listener as the API, so a browser reaching the API from
  # the page needs no CORS headers and this policy is not exercised here. It is
  # kept as the starting point for a deployment that serves the frontend from an
  # origin of its own: point allow-origins at the origins the product is served
  # from.
  cors:
    endpoints:
      api:
        allow-origins:
          - "https://app.demo.test"

ops:
  endpoint: ops
  title: demo
  version: 0.1.0
  description: "The demo assembly's API: every operation the modules named in this stack declare, merged from their OpenAPI fragments."
  servers: ["http://localhost:8080"]

webui:
  endpoint: web

log:
  level: info

observability:
  otel:
    service-name: demo
  otlp:
    endpoint: "127.0.0.1:4317"

authn:
  gate:
    endpoints: [api, account, admin]
    mount:
      endpoint: account
      # The origin this deployment is reached at from outside: the origin a
      # browser signs in from, and the one the WebAuthn relying party is bound
      # to. It is the address the backend listener serves (http.listeners),
      # written by host name — a relying party id has to be a domain, so the
      # loopback address is localhost.
      public-url: "http://localhost:8080"
  # DEV: the token signing key. The program generates one at
  # var/token-signing-key.pem, relative to the working directory, on the first
  # run and keeps it afterwards. Replace it with your own key material before a
  # deployment serves real traffic. The issuer and audience default to the
  # gateway's public URL.
  token:
    algorithm: ES256
    signing-key-file: var/token-signing-key.pem
  mfa:
    totp:
      issuer: demo
    # WebAuthn. The relying party is bound to the origin the deployment is
    # reached at (authn.gate.mount.public-url above); naming it here makes the
    # binding visible and is where a copy points it at its own domain. The id
    # has to be a domain, so it is localhost and not the loopback address the
    # listener names.
    webauthn:
      rp-id: localhost
      rp-name: demo
      origins:
        - "http://localhost:8080"

tenant:
  resolve:
    endpoints: [api]
    extractor: header
    header-name: X-Tenant
  admission:
    endpoints: [api]
  admin:
    endpoints: [admin]

authz:
  guard:
    endpoints: [api]
    undeclared: closed
  admin:
    endpoints: [admin]
  self:
    endpoints: [api]

audit:
  journal:
    endpoints: [api, account, admin]
    requests:
      - "POST /api/v1/objects"
      - "DELETE /api/v1/objects/:id"
  admin:
    endpoints: [admin]

ratelimit:
  endpoints: [api]

settings:
  admin:
    endpoints: [admin]

# The feature document. It lists the features this process serves, with a
# route the frontend reads. The endpoint named here has to be guarded by the
# authentication gateway (authn.gate.endpoints above), has to claim /features
# in its prefixes (http.endpoints above), and must not resolve a tenant: the
# frontend reads the document before a tenant is chosen.
feature:
  board:
    endpoint: account

# The host's own personal-tenant policy. Off by default: when on, an account
# with no membership gets a personal tenant from POST /workspace/personal so a
# registration can use the tenant area at once. The /workspace prefix above is
# claimed either way; with the switch off that path answers 404.
workspace:
  personal:
    enabled: false

notification:
  inbox:
    endpoints: [api]
  stream:
    endpoints: [api]
  preferences:
    endpoints: [api]

objectstore:
  fs:
    root: "./var/objects"
  metadata:
    endpoints: [api]

# The first account, the tenants this deployment serves, and the platform role
# a copy starts with. The seed command is idempotent: an account, a tenant, a
# role, a grant or a binding already there is left as it stands.
seed:
  # DEV: the initial operator's login name and password, and whether it
  # administers the platform. Replace both before a deployment serves real
  # traffic.
  accounts:
    - identifier: operator@demo.test
      password: operator-dev-secret
      display-name: Demo Operator
      platform-admin: true
  # The tenants the deployment serves. Each is registered in the roster, and
  # the operator above holds the platform-administrator role within each, so
  # the console's tenant-addressed pages answer for them out of the box.
  # DEV: replace with the tenants this deployment actually serves.
  tenants:
    - acme
  # Lowered to the domain minimum for local demonstration: impersonation
  # requires a non-SMS factor that has been active for at least
  # authn.mfa.sensitive-min-age, and the declared default of 24h leaves a
  # freshly enrolled factor ineligible for a day. Production keeps the
  # declared default; seed writes a value only while the global layer holds
  # no explicit row for the key.
  settings:
    - key: "authn.mfa.sensitive-min-age"
      value: "1h"

# DEV: the database encryption key seals the columns a module encrypts at rest.
db:
  postgres:
    dsn: "postgres://speed:speed@127.0.0.1:5432/speed?sslmode=disable"
    encryption-key: "dev-only-change-me-0123456789abcdef"

kv:
  redis:
    addr: "127.0.0.1:6379"

event:
  nats:
    url: "nats://127.0.0.1:4222"
