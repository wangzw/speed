# The postgres-memcached-nats stack: PostgreSQL for the database, memcached for
# the key-value store and NATS for the event bus. Memcached holds no state
# across a restart, so it is the key-value backend a deployment picks when the
# store is a pure cache:
#
#   docker compose -f starters/demo/compose.yaml up -d postgres memcached nats
#   go -C starters/demo/server run . --config file:testdata/postgres-memcached-nats.yaml postgres-memcached-nats migrate
#   go -C starters/demo/server run . --config file:testdata/postgres-memcached-nats.yaml postgres-memcached-nats serve
#
# This file is an override document. The platform topology — the endpoint table
# and every capability's mounting — is compiled into the binary
# (server/defaults.yaml) and layered below this file, so what is written here is
# what a deployment chooses: addresses, origins, the export destination, the
# seed and the backend section at the bottom. Only the backend section differs
# between the six stack files.
#
# The mounting keys repeated below — the tenant, authorization, audit, settings
# and feature endpoints, and webui.endpoint — are the ones the loader requires
# somebody to give. A required item is not satisfied by the defaults document,
# so every configuration states them; a copy edits them here.
#
# The values marked DEV are development defaults a copy must replace before
# serving real traffic (AGENTS.md lists them together).

http:
  listeners:
    backend:
      address: "127.0.0.1:8080"
    ops:
      address: "127.0.0.1:8083"
  # The CORS layer guards the api endpoint. This stack serves the frontend
  # bundle from the same listener as the API, so a browser reaching the API from
  # the page needs no CORS headers and this policy is not exercised here. It is
  # kept as the starting point for a deployment that serves the frontend from an
  # origin of its own: point allow-origins at the origins the product is served
  # from.
  cors:
    endpoints:
      api:
        allow-origins:
          - "https://app.demo.test"

# The operations surface's document metadata. Its endpoint is part of the
# platform topology and comes from defaults.yaml.
ops:
  title: demo
  version: 0.1.0
  description: "The demo assembly's API: every operation the modules named in this stack declare, merged from their OpenAPI fragments."
  servers: ["http://localhost:8080"]

# Required: the frontend bundle's endpoint, repeated from defaults.yaml.
webui:
  endpoint: web

observability:
  otel:
    service-name: demo

# The identity system's deployment values: the origin this deployment is
# reached at, the token signing key, and the relying party the step-up is bound
# to. The gateway's endpoint list and the account mount are platform topology
# and come from defaults.yaml.
authn:
  gate:
    mount:
      public-url: "http://localhost:8080"
  # DEV: the token signing key. Replace it with your own key material before a
  # deployment serves real traffic.
  token:
    signing-key-file: var/token-signing-key.pem
  mfa:
    totp:
      issuer: demo
    webauthn:
      rp-id: localhost
      rp-name: demo
      origins:
        - "http://localhost:8080"

# Tenant resolution and admission. The endpoints below and the extractor are
# required items, so they are stated here as well as in defaults.yaml.
tenant:
  resolve:
    endpoints: [api]
    extractor: header
  admission:
    endpoints: [api]
  admin:
    endpoints: [admin]

# The authorization layer. Both endpoint lists are required items.
authz:
  guard:
    endpoints: [api]
  admin:
    endpoints: [admin]
  self:
    endpoints: [api]

# The journal's request list and captured endpoints are platform topology and
# come from defaults.yaml; the management surface's endpoint list is required.
audit:
  admin:
    endpoints: [admin]

# Required: where the settings management routes mount.
settings:
  admin:
    endpoints: [admin]

# Required: where the feature document is served.
feature:
  board:
    endpoint: account

# The host's own personal-tenant policy; off in the baseline.
workspace:
  personal:
    enabled: false

# The object store's bytes are kept under this directory (created on startup).
objectstore:
  fs:
    root: "./var/objects"

# The first account, the tenants this deployment serves, and the platform role
# a copy starts with. The seed command is idempotent.
seed:
  # DEV: the initial operator's login name and password, and whether it
  # administers the platform. Replace both before a deployment serves real
  # traffic.
  accounts:
    - identifier: operator@demo.test
      password: operator-dev-secret
      display-name: Demo Operator
      platform-admin: true
  # The tenants the deployment serves. DEV: replace with the tenants this
  # deployment actually serves.
  tenants:
    - acme
  # Lowered to the domain minimum for local demonstration: impersonation
  # requires a non-SMS factor that has been active for at least
  # authn.mfa.sensitive-min-age, and the declared default of 24h leaves a
  # freshly enrolled factor ineligible for a day. Production keeps the
  # declared default; seed writes a value only while the global layer holds
  # no explicit row for the key.
  settings:
    - key: "authn.mfa.sensitive-min-age"
      value: "1h"

# DEV: the database encryption key seals the columns a module encrypts at rest.
db:
  postgres:
    dsn: "postgres://speed:speed@127.0.0.1:5432/speed?sslmode=disable"
    encryption-key: "dev-only-change-me-0123456789abcdef"

kv:
  memcached:
    servers:
      - "127.0.0.1:11211"

event:
  nats:
    url: "nats://127.0.0.1:4222"
