# The values marked DEV are development defaults a copy must replace before

http:
  listeners:
    backend:
      address: "127.0.0.1:8081"
  cors:
    endpoints:
      api:
        allow-origins:
          - "https://app.demo.test"

ops:
  title: demo
  version: 0.1.0
  description: "The demo assembly's API: every operation the modules named in this stack declare, merged from their OpenAPI fragments."
  servers: ["http://localhost:8081"]

observability:
  otel:
    service-name: demo

authn:
  gate:
    mount:
      public-url: "http://localhost:8081"
  # DEV: the token signing key. Replace it with your own key material before a
  token:
    signing-key-file: var/token-signing-key.pem
  mfa:
    totp:
      issuer: demo
    webauthn:
      rp-id: localhost
      rp-name: demo
      origins:
        - "http://localhost:8081"

objectstore:
  fs:
    root: "./var/objects"

seed:
  # DEV: the initial operator's login name and password, and whether it
  accounts:
    - identifier: operator
      password: operator-dev-secret
      display-name: Demo Operator
      platform-admin: true
  # administer it. DEV: replace with the tenants this deployment actually
  tenants:
    - name: acme
      admins:
        - operator
  settings:
    - key: "authn.mfa.sensitive-min-age"
      value: "1h"

# DEV: the database encryption key seals the columns a module encrypts at rest.
db:
  postgres:
    dsn: "postgres://speed:speed@127.0.0.1:5432/speed?sslmode=disable"
    encryption-key: "dev-only-change-me-0123456789abcdef"

kv:
  nats:
    url: "nats://127.0.0.1:4222"

event:
  redis:
    addr: "127.0.0.1:6379"
