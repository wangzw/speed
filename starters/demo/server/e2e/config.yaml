
http:
  listeners:
    backend:
      address: "127.0.0.1:8080"
  cors:
    endpoints:
      api:
        allow-origins:
          - "https://app.demo.test"

ops:
  title: demo
  version: 0.1.0
  description: "The demo assembly's API: every operation the modules named in this stack declare, merged from their OpenAPI fragments."
  servers: ["http://localhost:8080"]

observability:
  otel:
    service-name: demo

authn:
  gate:
    mount:
      public-url: "http://localhost:8080"
  admin:
    sso:
      enabled: true
  login:
    google:
      client-id: "e2e-google-client"
      client-secret: "e2e-google-secret"
      issuer: "https://accounts.google.com"
      allow-loopback: false
      root-ca-file: ""
    github:
      client-id: "e2e-github-client"
      client-secret: "e2e-github-secret"
    wechat-mp:
      app-id: "e2e-wechat-mp-app"
      app-secret: "e2e-wechat-mp-secret"
    wechat-web:
      app-id: "e2e-wechat-web-app"
      app-secret: "e2e-wechat-web-secret"
  sso:
    allow-private-egress: false
    dns-resolver: ""
    oidc-ca-file: ""
    oidc:
      enabled: true
    saml:
      enabled: true
  token:
    signing-key-file: var/token-signing-key.pem
  mfa:
    totp:
      issuer: demo
    webauthn:
      rp-id: localhost
      rp-name: demo
      origins:
        - "http://localhost:8080"
  humanverify:
    mode: off
    phone-mode: off
  invitemail:
    accept-base-url: "http://localhost:8080"

mail:
  carrier: log
sms:
  carrier: log
  registry:
    poll-interval: 200ms
    templates:
      authn.code.login:
        kind: verification
        params: ["code", "ttl_minutes"]
        codes:
          en-US: "e2e-login"
          zh-CN: "e2e-login-zh"
      authn.code.mfa:
        kind: verification
        params: ["code", "ttl_minutes"]
        codes:
          en-US: "e2e-mfa"
          zh-CN: "e2e-mfa-zh"
      authn.code.enroll:
        kind: verification
        params: ["code", "ttl_minutes"]
        codes:
          en-US: "e2e-enroll"
          zh-CN: "e2e-enroll-zh"
      authn.code.reset:
        kind: verification
        params: ["code", "ttl_minutes"]
        codes:
          en-US: "e2e-reset"
          zh-CN: "e2e-reset-zh"
  log:
    approvals:
      demo-notice-en:
        state: approved
  admin:
    endpoints: [admin]

objectstore:
  fs:
    root: "./var/objects"

seed:
  accounts:
    - identifier: operator@demo.test
      username: operator
      password: operator-dev-secret
      display-name: Demo Operator
      platform-admin: true
    - identifier: member
      password: member-dev-secret
      display-name: Demo Member
  tenants:
    - name: acme
      admins:
        - member
  members:
    - tenant: acme
      account: member
  settings:
    - key: "authn.account.signup"
      value: "open"
    - key: "authn.account.password-signup"
      value: "open"
    - key: "authn.login.password-reset"
      value: "open"
    - key: "authn.login.email-per-address-hourly"
      value: "60"
    - key: "authn.login.email-per-address-daily"
      value: "200"
    - key: "authn.login.email-per-account-hourly"
      value: "60"
    - key: "authn.login.email-per-account-daily"
      value: "1000"
    - key: "authn.login.email-per-source-hourly"
      value: "10000"
    - key: "authn.login.email-per-source-daily"
      value: "100000"
    - key: "authn.login.email-global-hourly"
      value: "1000"
    - key: "authn.login.email-resend-interval"
      value: "30s"
    - key: "authn.login.email-code-ttl"
      value: "30m"
    - key: "authn.mfa.sensitive-min-age"
      value: "1h"
    - key: "authn.impersonation.max-auth-age"
      value: "1m"
    - key: "authn.login.disabled-methods"
      value: '["wechat.mp"]'
    - key: "authn.sms.allowed-prefixes"
      value: '["+1","+86"]'
    - key: "authn.sms.resend-interval"
      value: "30s"
    - key: "authn.sms.per-source-hourly"
      value: "10000"
    - key: "authn.sms.per-source-daily"
      value: "100000"
    - key: "authn.sms.per-source-distinct-hourly"
      value: "10000"
    - key: "authn.sms.per-source-distinct-daily"
      value: "100000"
    - key: "authn.sms.per-source-attempt-hourly"
      value: "100000"
    - key: "ratelimit.address-rate"
      value: "1000"
    - key: "ratelimit.address-burst"
      value: "1000"
    - key: "ratelimit.address-penalty"
      value: "0"

demo:
  notification:
    enabled: true

jobs:
  scheduler:
    tick: 2s

db:
  sqlite:
    dsn: "./var/e2e.db"
    encryption-key: "dev-only-change-me-0123456789abcdef"
