# The platform defaults document of this program.
#
# It is compiled into the binary and layered below the configuration file a run
# is pointed at, and above each module's own prototype defaults. What belongs
# here is the topology every deployment of this binary shares: which endpoint
# claims which prefix, which endpoint each capability mounts on, which requests
# the journal records. Nothing here may be a credential or a value that differs
# between deployments — listener addresses, origins, paths on disk, database
# locators and the seed all live in the configuration file, and a copy changes
# those there.
#
# One rule shapes what a configuration file still has to say: a required input
# item IS satisfied by this document, and a prototype's field value is not. The
# document is the host naming a value on purpose, the same act as writing it in
# the configuration file, so a Required key stated here needs no copy in the
# file. A prototype value never counts, because it always holds something and
# could not tell "nobody gave a value" from a zero one. The mounting table below
# is therefore carried in full. What the document must not carry is a
# credential or a value that differs between deployments: those stay in the
# configuration file. See AGENTS.md.

http:
  # The product's fixed namespace map. The dispatch selects an endpoint by these
  # claims alone, the longest claim winning, and a path under no non-root claim
  # goes to the endpoint that claims "/". A capability dropped from a run, or
  # from the imports, keeps its namespace claimed.
  endpoints:
    api:
      listener: backend
      prefixes: ["/api"]
    account:
      listener: backend
      prefixes: ["/api/v1/auth", "/api/v1/features", "/api/v1/workspace"]
    admin:
      listener: backend
      prefixes: ["/api/v1/system/audit", "/api/v1/system/auth", "/api/v1/system/permissions", "/api/v1/system/settings", "/api/v1/system/sms", "/api/v1/system/tenants"]
    ops:
      # Alone on its listener, so it claims "/" by default.
      listener: ops
    content:
      # The object store's content route. A browser reaches it with no
      # credential at all, because an <img src> carries neither an Authorization
      # header nor a tenant header — the token in the query string is the
      # credential. It is therefore in none of the lists below that guard,
      # resolve, admit, authorize, throttle or journal an endpoint's requests:
      # any one of them would refuse the anonymous read or write the route
      # exists for. max-body-bytes 0 removes the endpoint's body limit; the
      # default 1 MiB would answer every large direct upload 413.
      listener: backend
      prefixes: ["/content"]
      max-body-bytes: 0
    web:
      listener: backend
      prefixes: ["/"]

# The operations surface mounts on the ops endpoint.
ops:
  endpoint: ops

# The frontend bundle's route covers this endpoint's whole path space.
webui:
  endpoint: web

# The identity system: the gateway guards the API, account and admin endpoints
# and never the web endpoint. Its ordinary routes mount on the account endpoint,
# which the tenant layers do not cover; its platform-management routes mount on
# the admin endpoint, whose platform-administration namespace they share, and
# which the tenant layers do not cover either; its tenant-administration routes
# mount on the API endpoint, which they do cover, because those routes are
# decided in the tenant policy domain.
authn:
  gate:
    endpoints: [api, account, admin]
    mount:
      endpoints:
        default: account
        tenants: api
        system: admin

# Tenant resolution and admission guard the API endpoint and never the account
# endpoint the authentication routes mount on. The header extractor is this
# assembly's tenant contract; the frontend writes the tenant name into it.
tenant:
  resolve:
    endpoints: [api]
    extractor: header
  admission:
    endpoints: [api]
  admin:
    endpoints: [admin]
  self:
    # The caller's own tenant list. It mounts on the account endpoint, which
    # resolves no tenant: the answer is about the caller, not about one tenant.
    endpoints: [account]

# The authorization layer: the guard enforces the API endpoint, the
# management routes mount on the admin endpoint, and every authenticated
# caller reads its own permissions from the API endpoint.
authz:
  guard:
    endpoints: [api]
  admin:
    endpoints: [admin]
  self:
    endpoints: [api]

# The journal records the writes this product carries that no capability
# records at its own seam. The requests list is empty: every write left in the
# assembly — sign-in, impersonation, account management, roles, settings,
# tenants, SMS — records at the seam the capability itself writes, so a request
# entry beside one would record it twice, and the frontend's own polls would
# land a row per poll. A host that adds a write of its own lists it here.
audit:
  journal:
    endpoints: [api, account, admin]
    requests: []
  admin:
    endpoints: [admin]

# The two limiting layers name their endpoints separately. endpoints is the
# quota layer: it charges a settled identity inside a tenant. address-endpoints
# is the address shield: a coarse load shield, not a per-recipient send limit.
# It counts requests per client address before any identity is settled, so a
# source that keeps being refused is shut out before it reaches the
# authentication backend. The send budgets bound messages per recipient, source
# and account and live with the capabilities that send; this layer bounds
# requests per address per interval and knows nothing about a message.
ratelimit:
  endpoints: [api]
  address-endpoints: [account]

settings:
  admin:
    endpoints: [admin]

# The feature document's endpoint is guarded by the authentication gateway, and
# must not resolve a tenant: the frontend reads the document before a tenant is
# chosen.
feature:
  board:
    endpoint: account

# The notification surfaces mount on the API endpoint. None of them names the
# web endpoint: the frontend bundle's catch-all route covers that endpoint's
# whole path space.
notification:
  inbox:
    endpoints: [api]
  stream:
    endpoints: [api]
  preferences:
    endpoints: [api]

# The object store has no client-facing API: the business backend mints a URL
# through the capability and the browser fetches the bytes from the content
# endpoint above, which the list below names. Where the bytes are kept is a
# deployment path and lives in the configuration file.
objectstore:
  metadata:
    content-endpoints: [content]
