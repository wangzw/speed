# 用途：Scheduler 通过 `gh workflow run` 派发，渲染看板并发布到 gh-pages 分支。
#
# 这是确定性脚本任务，不涉及 agent 推理，不需要 anthropics/claude-code-action。
# `.claude/skills/coding-flow/templates/dashboard/` 由 `init` 时一次性拷贝进本仓库、
# 提交入库（见 ../../SKILL.md「Skill 封装与复用」），所以这里 checkout 一下就自然有
# render.py 和模板，不需要额外从别处拉取。
#
# 参考规范：../../SKILL.md「看板：调度状态可视化」、../../references/scheduler.md「看板发布」

name: coding-flow dashboard-render
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 见 ../../references/scheduler.md「轮询节奏」的超时阈值表
    permissions:
      contents: write
      issues: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render dashboard
        run: |
          set -euo pipefail
          mkdir -p /tmp/coding-flow-dashboard
          python3 .claude/skills/coding-flow/templates/dashboard/render.py \
            .claude/skills/coding-flow/templates/dashboard/index.html.template \
            /tmp/coding-flow-dashboard/index.html

      - name: Publish to gh-pages
        run: bash .claude/skills/coding-flow/templates/dashboard/publish.sh /tmp/coding-flow-dashboard/index.html
