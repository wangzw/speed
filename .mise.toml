# Toolchain versions for local development, pinned by mise: `mise install` sets
# up what `make check` needs. The go, node and pnpm pins mirror go.work,
# web/.nvmrc and web/package.json; the rest have no mirror and are not checked.

[env]
_.file = ".env"

[tools]
go = "1.27.4"
node = "26"
pnpm = "12.21.0"
golangci-lint = "2.15.0"
python = "3.14.7"
"aqua:rhysd/actionlint" = "1.7.12"
# Pinned here only; `make actionlint` points actionlint at this shellcheck with
# -shellcheck, and actionlint runs it over every `run:` script of the workflows.
shellcheck = "0.11.0"
