# Toolchain versions for local development, pinned by mise (https://mise.jdx.dev).
# `mise install` from the repository root sets up everything `make check` needs.
#
# go (go.work's `go` directive), node (web/.nvmrc) and pnpm (web/package.json's
# `packageManager`) MIRROR an authoritative source; starters/demo/Dockerfile's
# golang and node image tags mirror the same sources. tools/check_toolchain.py
# fails when a mirror drifts, so bump a mirror and its source together. The
# remaining tools are pinned here and nowhere else, have no mirror, and are not
# checked.

[env]
_.file = ".env"

[tools]
go = "1.27.4"
node = "26"
pnpm = "12.21.0"
golangci-lint = "2.15.0"
python = "3.14.7"
"aqua:rhysd/actionlint" = "1.7.12"
# Pinned here only; `make actionlint` points actionlint at this shellcheck with
# -shellcheck, and actionlint runs it over every `run:` script of the workflows.
shellcheck = "0.11.0"
