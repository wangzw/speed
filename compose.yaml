services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: speed
      POSTGRES_PASSWORD: speed
      POSTGRES_DB: speed
    ports:
      - "127.0.0.1:${SPEED_TEST_PG_PORT:-5432}:5432"
    command: ["-c", "max_connections=500"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speed -d speed"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${SPEED_TEST_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports:
      - "127.0.0.1:${SPEED_TEST_NATS_PORT:-4222}:4222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222"]
      interval: 2s
      timeout: 5s
      retries: 30

  memcached:
    image: memcached:1.6-alpine
    ports:
      - "127.0.0.1:${SPEED_TEST_MEMCACHED_PORT:-11211}:11211"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 11211"]
      interval: 2s
      timeout: 5s
      retries: 30
