version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration
    - e2e

linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - errorlint
    - misspell
    - rowserrcheck
    - sqlclosecheck

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
    staticcheck:
      checks:
        - all
    gosec:
      excludes:
        - G104

  exclusions:
    generated: lax
    rules:
      - path: _test\.go$
        linters:
          - gosec
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vislake/speed
